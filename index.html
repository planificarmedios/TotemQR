<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Totem Interactivo</title>

    <style>
      /* =====================================================
         CONFIGURACIÓN GENERAL
         ===================================================== */

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;
      }

      #totemWrapper {
        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        overflow: hidden;

        transform-origin: center center;
      }

      /* =====================================================
         VIDEO INTRO

         ESTE VIDEO ES EL FONDO DEL INDEX.
         NO SE ROTA.
         ===================================================== */

      #standbyVideo {
        position: absolute;

        top: 0;
        left: 0;

        width: 170%;
        height: 150%;

        object-fit: contain;

        object-position: 50% 50%;

        transform: translate(-20%, -20%) scale(1.19) rotate(270deg);

        transform-origin: center center;

        filter: brightness(1) contrast(1) saturate(1);

        pointer-events: none;

        z-index: 0;

        display: block;
      }

      /* =====================================================
         VIDEO DE MESA
         ===================================================== */

      #mesaVideo {
        position: absolute;

        top: 0;
        left: 0;

        width: 200%;
        height: 200%;

        object-fit: contain;

        object-position: 50% 50%;

        transform: translate(-6%, 1%) scale(1.19) rotate(270deg);

        transform-origin: center center;

        filter: brightness(1) contrast(1) saturate(1);

        pointer-events: none;

        z-index: 1;

        display: none;
      }

      /* =====================================================
         QR
         ===================================================== */

      #qrContainer {
        position: absolute;

        top: 20%;
        left: 20%;

        width: 320px;

        background: rgba(0, 0, 0, 0.9);

        border: 2px solid #666;

        border-radius: 8px;

        box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);

        z-index: 1000;

        color: #fff;

        display: flex;

        flex-direction: column;

        align-items: center;

        cursor: move;

        padding: 10px;

        box-sizing: border-box;

        /* =================================================
           ARRASTRE Y ROTACIÓN DEL QR
           ================================================= */

        transform: rotate(0deg);

        transform-origin: center center;

        user-select: none;

        touch-action: none;
      }

      /* =====================================================
         VIDEO / ÁREA DE CÁMARA QR
         ===================================================== */

      #qrVideo {
        position: relative;

        width: 280px;
        height: 220px;

        border: 2px solid lime;

        overflow: hidden;

        box-sizing: border-box;
      }

      /* =====================================================
         EFECTO MIRA / ESCÁNER QR
         ===================================================== */

      #qrScannerOverlay {
        position: absolute;

        inset: 0;

        z-index: 20;

        pointer-events: none;

        display: flex;

        justify-content: center;

        align-items: center;

        transition: opacity 0.3s ease;
      }

      .qrScanFrame {
        position: relative;

        width: 190px;
        height: 190px;
      }

      /* =====================================================
         ESQUINAS DEL QR
         ===================================================== */

      .qrCorner {
        position: absolute;

        width: 35px;
        height: 35px;

        border-color: #00ff66;

        border-style: solid;

        filter: drop-shadow(0 0 5px #00ff66);
      }

      .qrCorner.topLeft {
        top: 0;
        left: 0;

        border-width: 4px 0 0 4px;
      }

      .qrCorner.topRight {
        top: 0;
        right: 0;

        border-width: 4px 4px 0 0;
      }

      .qrCorner.bottomLeft {
        bottom: 0;
        left: 0;

        border-width: 0 0 4px 4px;
      }

      .qrCorner.bottomRight {
        bottom: 0;
        right: 0;

        border-width: 0 4px 4px 0;
      }

      /* =====================================================
         LÁSER
         ===================================================== */

      .qrLaser {
        position: absolute;

        left: 0;

        width: 100%;
        height: 3px;

        background: #ff1744;

        box-shadow:
          0 0 5px #ff1744,
          0 0 10px #ff1744,
          0 0 20px #ff1744;

        animation: qrLaserScan 2s ease-in-out infinite;
      }

      @keyframes qrLaserScan {
        0% {
          top: 0;
          opacity: 0.5;
        }

        50% {
          opacity: 1;
        }

        100% {
          top: calc(100% - 3px);
          opacity: 0.5;
        }
      }

      /* =====================================================
         TEXTO ESCÁNER
         ===================================================== */

      .qrScanText {
        position: absolute;

        bottom: 8px;

        padding: 3px 8px;

        border-radius: 5px;

        background: rgba(0, 0, 0, 0.65);

        color: #00ff66;

        font-family: Arial, sans-serif;

        font-size: 11px;

        font-weight: bold;

        letter-spacing: 2px;

        text-shadow: 0 0 5px #00ff66;
      }

      /* =====================================================
         QR DETECTADO
         ===================================================== */

      #qrScannerOverlay.detected .qrCorner {
        border-color: #00ff00;

        filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 15px #00ff00);

        animation: qrDetected 0.4s ease;
      }

      #qrScannerOverlay.detected .qrLaser {
        background: #00ff00;

        box-shadow:
          0 0 10px #00ff00,
          0 0 25px #00ff00;

        animation: none;

        top: 50%;
      }

      #qrScannerOverlay.detected .qrScanText {
        color: #00ff00;

        text-shadow: 0 0 10px #00ff00;
      }

      @keyframes qrDetected {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.12);
        }

        100% {
          transform: scale(1);
        }
      }

      /* =====================================================
         RESULTADO QR
         ===================================================== */

      #qrResult {
        font-weight: bold;

        margin-top: 5px;

        text-align: center;
      }

      /* =====================================================
         BOTÓN CÁMARAS
         ===================================================== */

      #selectCamsBtn {
        margin-top: 10px;

        padding: 5px 10px;

        border: none;

        background: limegreen;

        color: white;

        border-radius: 5px;

        cursor: pointer;
      }

      /* =====================================================
         MODAL CÁMARAS
         ===================================================== */

      #camModal {
        display: none;

        position: fixed;

        top: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        background: rgba(0, 0, 0, 0.7);

        justify-content: center;

        align-items: center;

        z-index: 2000;
      }

      #camModal .content {
        background: #fff;

        padding: 20px;

        border-radius: 10px;

        width: 400px;

        max-width: 90%;
      }

      /* =====================================================
         BOTÓN ROTAR

         SOLO PARA PRUEBAS DEL QR.
         NO ROTA EL INTRO.
         ===================================================== */

      #rotateBtn {
        position: fixed;

        bottom: 20px;
        right: 20px;

        z-index: 2000;

        padding: 10px 15px;

        border-radius: 50%;

        border: none;

        background: #4104f5;

        color: #fff;

        font-size: 20px;

        cursor: pointer;

        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         CONTENEDOR PRINCIPAL
         ===================================================== -->

    <div id="totemWrapper">
      <!-- ===================================================
           VIDEO DE FONDO

           intro.mp4 se reproduce directamente desde INDEX.

           IMPORTANTE:
           - autoplay
           - muted
           - loop
           - playsinline
           - z-index 0
           =================================================== -->

      <video id="standbyVideo" autoplay muted loop playsinline preload="auto">
        <source src="videos/intro.mp4" type="video/mp4" />

        Tu navegador no soporta video HTML5.
      </video>

      <!-- =====================================================
           VIDEO DE MESA

           Permanece oculto mientras esperamos el QR.
           Cuando se detecta una mesa, app.js indicará
           qué video cargar.
           ===================================================== -->

      <video id="mesaVideo" muted loop playsinline preload="auto">
        <source src="" type="video/mp4" />
      </video>

      <!-- ===================================================
           QR
           =================================================== -->

      <div id="qrContainer">
        <div id="qrVideo">
          <div id="qrScannerOverlay">
            <div class="qrScanFrame">
              <div class="qrCorner topLeft"></div>

              <div class="qrCorner topRight"></div>

              <div class="qrCorner bottomLeft"></div>

              <div class="qrCorner bottomRight"></div>

              <div class="qrLaser"></div>
            </div>

            <div class="qrScanText">ESCANEANDO...</div>
          </div>
        </div>

        <div id="qrResult">❌ Activar cámara</div>

        <button id="selectCamsBtn">Seleccionar Cámaras</button>
      </div>
    </div>

    <!-- =====================================================
         BOTÓN ROTAR
         ===================================================== -->

    <button id="rotateBtn">⟳</button>

    <!-- =====================================================
         MODAL DE CÁMARAS
         ===================================================== -->

    <div id="camModal">
      <div class="content">
        <h3>Seleccionar Cámaras</h3>

        <div>
          <label for="qrCamSelect"> Cámara QR: </label>

          <select id="qrCamSelect"></select>
        </div>

        <button id="saveCamSelection" style="margin-top: 10px">Guardar</button>

        <button id="closeCamModal" style="margin-top: 10px; margin-left: 10px">
          Cerrar
        </button>
      </div>
    </div>

    <!-- =====================================================
         LIBRERÍA QR
         ===================================================== -->

    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- =====================================================
         ME SPEAK
         ===================================================== -->

    <script src="mespeak/mespeak.js"></script>

    <!-- =====================================================
         APP PRINCIPAL
         ===================================================== -->

    <script src="app.js"></script>

    <!-- =====================================================
         CONFIGURACIÓN / ARRASTRE / ROTACIÓN DEL QR
         ===================================================== -->

    <script>
      const qrContainer = document.getElementById("qrContainer");

      const rotateBtn = document.getElementById("rotateBtn");

      let qrDragging = false;

      let qrStartX = 0;
      let qrStartY = 0;

      let qrStartLeft = 0;
      let qrStartTop = 0;

      let qrRotation = parseInt(localStorage.getItem("qrRotation") || "0", 10);

      /* =====================================================
         RESTAURAR POSICIÓN Y ROTACIÓN
         ===================================================== */

      const qrSavedLeft = localStorage.getItem("qrLeft");

      const qrSavedTop = localStorage.getItem("qrTop");

      if (qrSavedLeft !== null && qrSavedTop !== null) {
        qrContainer.style.left = qrSavedLeft + "px";

        qrContainer.style.top = qrSavedTop + "px";
      }

      qrContainer.style.transform = `rotate(${qrRotation}deg)`;

      /* =====================================================
         COMENZAR ARRASTRE
         ===================================================== */

      qrContainer.addEventListener("pointerdown", (e) => {
        /*
         * Si hacemos clic sobre un botón,
         * select, input o textarea,
         * dejamos que funcione normalmente.
         */

        if (e.target.closest("button, select, input, textarea")) {
          return;
        }

        qrDragging = true;

        qrContainer.setPointerCapture(e.pointerId);

        qrStartX = e.clientX;
        qrStartY = e.clientY;

        qrStartLeft = qrContainer.offsetLeft;

        qrStartTop = qrContainer.offsetTop;

        qrContainer.style.cursor = "grabbing";

        e.preventDefault();
      });

      /* =====================================================
         MOVER QR
         ===================================================== */

      qrContainer.addEventListener("pointermove", (e) => {
        if (!qrDragging) {
          return;
        }

        const deltaX = e.clientX - qrStartX;

        const deltaY = e.clientY - qrStartY;

        let nuevaLeft = qrStartLeft + deltaX;

        let nuevaTop = qrStartTop + deltaY;

        /* =================================================
             LIMITAR A LA PANTALLA
             ================================================= */

        const maxLeft = window.innerWidth - qrContainer.offsetWidth;

        const maxTop = window.innerHeight - qrContainer.offsetHeight;

        nuevaLeft = Math.max(0, Math.min(nuevaLeft, maxLeft));

        nuevaTop = Math.max(0, Math.min(nuevaTop, maxTop));

        qrContainer.style.left = nuevaLeft + "px";

        qrContainer.style.top = nuevaTop + "px";
      });

      /* =====================================================
         TERMINAR ARRASTRE
         ===================================================== */

      qrContainer.addEventListener("pointerup", (e) => {
        if (!qrDragging) {
          return;
        }

        qrDragging = false;

        qrContainer.style.cursor = "move";

        /* =================================================
             GUARDAR POSICIÓN
             ================================================= */

        localStorage.setItem("qrLeft", qrContainer.offsetLeft);

        localStorage.setItem("qrTop", qrContainer.offsetTop);
      });

      qrContainer.addEventListener("pointercancel", () => {
        qrDragging = false;

        qrContainer.style.cursor = "move";
      });

      /* =====================================================
         ROTAR QR
         ===================================================== */

      rotateBtn.addEventListener("click", () => {
        qrRotation += 90;

        if (qrRotation >= 360) {
          qrRotation = 0;
        }

        qrContainer.style.transform = `rotate(${qrRotation}deg)`;

        /* =================================================
             GUARDAR ROTACIÓN
             ================================================= */

        localStorage.setItem("qrRotation", qrRotation);

        console.log("🔄 Rotación QR:", qrRotation + "°");
      });

      /* =====================================================
         DIAGNÓSTICO QR
         ===================================================== */

      console.log("==============================================");

      console.log("📷 CONFIGURACIÓN QR");

      console.log(
        "📍 Posición:",
        qrContainer.offsetLeft,
        qrContainer.offsetTop,
      );

      console.log("🔄 Rotación:", qrRotation + "°");

      console.log("==============================================");
    </script>

    <!-- =====================================================
         DIAGNÓSTICO VIDEO INTRO
         ===================================================== -->

    <script>
      console.log("==============================================");

      console.log("🎬 INDEX.HTML");

      console.log("==============================================");

      console.log(
        "🎞️ Elemento standbyVideo:",
        document.getElementById("standbyVideo"),
      );

      console.log(
        "📐 Tamaño ventana:",
        window.innerWidth,
        "x",
        window.innerHeight,
      );

      console.log("==============================================");
    </script>
  </body>
</html>
