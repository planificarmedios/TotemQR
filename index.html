<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Totem Interactivo</title>

    <!-- =====================================================
         CSS PRINCIPAL DEL VIDEO DE MESA
         Este archivo contiene los valores de posición,
         tamaño, escala y rotación configurados desde ajuste.html.
         ===================================================== -->

    <link rel="stylesheet" href="mesaVideo.css" />

    <style>
      /* =====================================================
         CONFIGURACIÓN GENERAL
         ===================================================== */

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;
      }

      #totemWrapper {
        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        overflow: hidden;

        transform-origin: center center;

        transition: transform 0.6s ease;
      }

      /* =====================================================
         VIDEO DE ESPERA
         ===================================================== */

      #standbyVideo {
        position: absolute;

        top: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        object-fit: cover;
        object-position: center center;

        transform: scale(1);

        pointer-events: none;

        z-index: -3;

        display: block;
      }

      /* =====================================================
         QR
         ===================================================== */

      #qrContainer {
        position: absolute;

        top: 20%;
        left: 20%;

        width: 320px;

        background: rgba(0, 0, 0, 0.9);

        border: 2px solid #666;

        border-radius: 8px;

        box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);

        z-index: 1000;

        color: #fff;

        display: flex;

        flex-direction: column;

        align-items: center;

        cursor: move;

        padding: 10px;

        box-sizing: border-box;
      }

      #qrVideo {
        position: relative;

        width: 280px;
        height: 220px;

        border: 2px solid lime;

        overflow: hidden;

        box-sizing: border-box;
      }

      /* =====================================================
         EFECTO MIRA / ESCÁNER QR
         ===================================================== */

      #qrScannerOverlay {
        position: absolute;

        inset: 0;

        z-index: 20;

        pointer-events: none;

        display: flex;

        justify-content: center;
        align-items: center;

        transition: opacity 0.3s ease;
      }

      .qrScanFrame {
        position: relative;

        width: 190px;
        height: 190px;
      }

      /* =====================================================
         ESQUINAS DEL QR
         ===================================================== */

      .qrCorner {
        position: absolute;

        width: 35px;
        height: 35px;

        border-color: #00ff66;

        border-style: solid;

        filter: drop-shadow(0 0 5px #00ff66);
      }

      .qrCorner.topLeft {
        top: 0;
        left: 0;

        border-width: 4px 0 0 4px;
      }

      .qrCorner.topRight {
        top: 0;
        right: 0;

        border-width: 4px 4px 0 0;
      }

      .qrCorner.bottomLeft {
        bottom: 0;
        left: 0;

        border-width: 0 0 4px 4px;
      }

      .qrCorner.bottomRight {
        bottom: 0;
        right: 0;

        border-width: 0 4px 4px 0;
      }

      /* =====================================================
         LÁSER
         ===================================================== */

      .qrLaser {
        position: absolute;

        left: 0;

        width: 100%;
        height: 3px;

        background: #ff1744;

        box-shadow:
          0 0 5px #ff1744,
          0 0 10px #ff1744,
          0 0 20px #ff1744;

        animation: qrLaserScan 2s ease-in-out infinite;
      }

      @keyframes qrLaserScan {
        0% {
          top: 0;
          opacity: 0.5;
        }

        50% {
          opacity: 1;
        }

        100% {
          top: calc(100% - 3px);
          opacity: 0.5;
        }
      }

      /* =====================================================
         TEXTO DEL ESCÁNER
         ===================================================== */

      .qrScanText {
        position: absolute;

        bottom: 8px;

        padding: 3px 8px;

        border-radius: 5px;

        background: rgba(0, 0, 0, 0.65);

        color: #00ff66;

        font-family: Arial, sans-serif;

        font-size: 11px;

        font-weight: bold;

        letter-spacing: 2px;

        text-shadow: 0 0 5px #00ff66;
      }

      /* =====================================================
         QR DETECTADO
         ===================================================== */

      #qrScannerOverlay.detected .qrCorner {
        border-color: #00ff00;

        filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 15px #00ff00);

        animation: qrDetected 0.4s ease;
      }

      #qrScannerOverlay.detected .qrLaser {
        background: #00ff00;

        box-shadow:
          0 0 10px #00ff00,
          0 0 25px #00ff00;

        animation: none;

        top: 50%;
      }

      #qrScannerOverlay.detected .qrScanText {
        color: #00ff00;

        text-shadow: 0 0 10px #00ff00;
      }

      @keyframes qrDetected {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.12);
        }

        100% {
          transform: scale(1);
        }
      }

      /* =====================================================
         RESULTADO QR
         ===================================================== */

      #qrResult {
        font-weight: bold;

        margin-top: 5px;

        text-align: center;
      }

      /* =====================================================
         BOTÓN CÁMARAS
         ===================================================== */

      #selectCamsBtn {
        margin-top: 10px;

        padding: 5px 10px;

        border: none;

        background: limegreen;

        color: white;

        border-radius: 5px;

        cursor: pointer;
      }

      /* =====================================================
         MODAL DE CÁMARAS
         ===================================================== */

      #camModal {
        display: none;

        position: fixed;

        top: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        background: rgba(0, 0, 0, 0.7);

        justify-content: center;

        align-items: center;

        z-index: 2000;
      }

      #camModal .content {
        background: #fff;

        padding: 20px;

        border-radius: 10px;

        width: 400px;

        max-width: 90%;
      }

      /* =====================================================
         BOTÓN ROTAR
         ===================================================== */

      #rotateBtn {
        position: fixed;

        bottom: 20px;
        right: 20px;

        z-index: 2000;

        padding: 10px 15px;

        border-radius: 50%;

        border: none;

        background: #4104f5;

        color: #fff;

        font-size: 20px;

        cursor: pointer;

        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         CONTENEDOR PRINCIPAL
         ===================================================== -->

    <div id="totemWrapper">
      <!-- =================================================
           VIDEO DE ESPERA
           ================================================= -->

      <video id="standbyVideo" autoplay muted loop playsinline>
        <source src="videos/intro.mp4" type="video/mp4" />

        Tu navegador no soporta video HTML5.
      </video>

      <!-- =================================================
           VIDEO DE LA MESA

           IMPORTANTE:
           NO colocamos aquí estilos de tamaño/posición.

           Todo eso viene de mesaVideo.css
           ================================================= -->

      <video id="mesaVideo" playsinline>
        <source src="videos/mesa-1.mp4" type="video/mp4" />

        Tu navegador no soporta video HTML5.
      </video>

      <!-- =================================================
           QR
           ================================================= -->

      <div id="qrContainer">
        <div id="qrVideo">
          <div id="qrScannerOverlay">
            <div class="qrScanFrame">
              <div class="qrCorner topLeft"></div>

              <div class="qrCorner topRight"></div>

              <div class="qrCorner bottomLeft"></div>

              <div class="qrCorner bottomRight"></div>

              <div class="qrLaser"></div>
            </div>

            <div class="qrScanText">ESCANEANDO...</div>
          </div>
        </div>

        <div id="qrResult">❌ Activar cámara</div>

        <button id="selectCamsBtn">Seleccionar Cámaras</button>
      </div>
    </div>

    <!-- =====================================================
         BOTÓN ROTAR
         ===================================================== -->

    <button id="rotateBtn">⟳</button>

    <!-- =====================================================
         MODAL DE CÁMARAS
         ===================================================== -->

    <div id="camModal">
      <div class="content">
        <h3>Seleccionar Cámaras</h3>

        <div>
          <label for="qrCamSelect"> Cámara QR: </label>

          <select id="qrCamSelect"></select>
        </div>

        <button id="saveCamSelection" style="margin-top: 10px">Guardar</button>

        <button id="closeCamModal" style="margin-top: 10px; margin-left: 10px">
          Cerrar
        </button>
      </div>
    </div>

    <!-- =====================================================
         LIBRERÍA QR
         ===================================================== -->

    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- =====================================================
         ME SPEAK
         =====================================================

         La dejamos porque app.js puede seguir utilizándola
         para las pruebas, aunque el funcionamiento normal
         del tótem ya NO habla al detectar el QR.
         ===================================================== -->

    <script src="mespeak/mespeak.js"></script>

    <!-- =====================================================
         APP PRINCIPAL
         ===================================================== -->

    <script src="app.js"></script>

    <!-- =====================================================
         FUNCIONALIDADES DEL INDEX
         ===================================================== -->

    <script>
      /* =====================================================
         DRAG DE LA VENTANA QR
         ===================================================== */

      const qrContainer = document.getElementById("qrContainer");

      let offsetX = 0;
      let offsetY = 0;

      let isDown = false;

      qrContainer.addEventListener("mousedown", (e) => {
        isDown = true;

        offsetX = e.clientX - qrContainer.offsetLeft;

        offsetY = e.clientY - qrContainer.offsetTop;
      });

      document.addEventListener("mouseup", () => {
        isDown = false;
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDown) {
          return;
        }

        qrContainer.style.left = e.clientX - offsetX + "px";

        qrContainer.style.top = e.clientY - offsetY + "px";
      });

      /* =====================================================
         ROTACIÓN DEL TOTEM
         ===================================================== */

      let rotation = 0;

      document.getElementById("rotateBtn").onclick = () => {
        rotation = (rotation + 90) % 360;

        const wrapper = document.getElementById("totemWrapper");

        wrapper.style.transform = `rotate(${rotation}deg)`;
      };
    </script>
  </body>
</html>
