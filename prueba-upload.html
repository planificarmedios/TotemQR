<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Prueba subida de videos</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;

        font-family: Arial, sans-serif;

        background: #111;
        color: white;
      }

      .container {
        max-width: 600px;
        margin: auto;

        padding: 30px;

        background: #222;

        border-radius: 12px;

        border: 1px solid #444;
      }

      h1 {
        margin-top: 0;
      }

      .field {
        margin-bottom: 20px;
      }

      label {
        display: block;

        margin-bottom: 8px;

        font-weight: bold;
      }

      input,
      select,
      button {
        width: 100%;

        padding: 12px;

        border-radius: 6px;

        border: 1px solid #555;

        font-size: 15px;
      }

      input,
      select {
        background: #111;

        color: white;
      }

      button {
        margin-top: 10px;

        background: #00a86b;

        color: white;

        border: none;

        font-weight: bold;

        cursor: pointer;
      }

      button:hover {
        background: #00c77f;
      }

      #mesaField {
        display: block;
      }

      #resultado {
        margin-top: 20px;

        padding: 12px;

        border-radius: 6px;

        background: #111;

        white-space: pre-wrap;
      }

      .ok {
        color: #00ff88;
      }

      .error {
        color: #ff6666;
      }

      .lista {
        margin-top: 30px;

        padding-top: 20px;

        border-top: 1px solid #444;
      }

      .videoItem {
        padding: 10px;

        margin-bottom: 8px;

        background: #111;

        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🎬 Prueba de subida de videos</h1>

      <div class="field">
        <label for="tipo"> Tipo de video </label>

        <select id="tipo">
          <option value="mesa">Mesa</option>

          <option value="intro">Intro</option>
        </select>
      </div>

      <div class="field" id="mesaField">
        <label for="mesa"> Número de mesa </label>

        <input type="text" id="mesa" placeholder="Ejemplo: 01" />
      </div>

      <div class="field">
        <label for="video"> Seleccionar video MP4 </label>

        <input type="file" id="video" accept="video/mp4,.mp4" />
      </div>

      <button id="uploadBtn" type="button">⬆️ SUBIR VIDEO</button>

      <div id="resultado">Esperando...</div>

      <div class="lista">
        <h2>Videos existentes</h2>

        <div id="listaVideos">Cargando...</div>
      </div>
    </div>

    <script>
      const tipo = document.getElementById("tipo");

      const mesaField = document.getElementById("mesaField");

      const mesa = document.getElementById("mesa");

      const video = document.getElementById("video");

      const uploadBtn = document.getElementById("uploadBtn");

      const resultado = document.getElementById("resultado");

      const listaVideos = document.getElementById("listaVideos");

      /* =====================================================
       CAMBIO DE TIPO
       ===================================================== */

      tipo.addEventListener("change", () => {
        if (tipo.value === "mesa") {
          mesaField.style.display = "block";
        } else {
          mesaField.style.display = "none";
        }
      });

      /* =====================================================
       CARGAR VIDEOS
       ===================================================== */

      async function cargarVideos() {
        try {
          const response = await fetch("/api/videos");

          if (!response.ok) {
            throw new Error("Error consultando API");
          }

          const data = await response.json();

          let html = "";

          if (data.intro) {
            html += `
            <div class="videoItem">
              🎬 <strong>INTRO</strong>
              <br>
              intro.mp4
            </div>
          `;
          }

          data.mesas.forEach((numero) => {
            html += `
              <div class="videoItem">
                🪑 <strong>Mesa ${numero}</strong>
                <br>
                mesa-${numero}.mp4
              </div>
            `;
          });

          if (!html) {
            html = "No hay videos.";
          }

          listaVideos.innerHTML = html;
        } catch (error) {
          listaVideos.innerHTML = `<span class="error">
            ${error.message}
          </span>`;
        }
      }

      /* =====================================================
       SUBIR
       ===================================================== */

      uploadBtn.addEventListener("click", async () => {
        resultado.className = "";

        resultado.textContent = "Subiendo video...";

        const archivo = video.files[0];

        if (!archivo) {
          resultado.className = "error";

          resultado.textContent = "Seleccioná primero un archivo MP4.";

          return;
        }

        if (tipo.value === "mesa" && !mesa.value.trim()) {
          resultado.className = "error";

          resultado.textContent = "Ingresá el número de mesa.";

          return;
        }

        const formData = new FormData();

        formData.append("video", archivo);

        formData.append("tipo", tipo.value);

        if (tipo.value === "mesa") {
          formData.append("mesa", mesa.value.trim());
        }

        try {
          const response = await fetch("/api/videos/upload", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "No se pudo subir el video.");
          }

          resultado.className = "ok";

          resultado.textContent = `✓ ${data.mensaje}

Archivo guardado como:
${data.nombre}`;

          /*
           * Limpiar selección
           */

          video.value = "";

          /*
           * Actualizar listado
           */

          cargarVideos();
        } catch (error) {
          resultado.className = "error";

          resultado.textContent = `✗ ${error.message}`;
        }
      });

      /* =====================================================
       INICIO
       ===================================================== */

      cargarVideos();
    </script>
  </body>
</html>
